name: PawPet
options:
  bundleIdPrefix: com.kotoko
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PawPet:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: Resources/PetMedia
        type: folder
        buildPhase: resources
      - path: Resources/PetFrames
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kotoko.pawpet
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        CODE_SIGN_ENTITLEMENTS: App/PawPet.entitlements
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "需要访问相册来选择你家宠物的照片，用于生成专属桌宠"
        INFOPLIST_KEY_NSCameraUsageDescription: "可以直接拍一张宠物照片来生成专属桌宠"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: "爪爪桌宠"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: 爪爪桌宠
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true # 开发期本地后端 http；上架前改为域名白名单
        CFBundleURLTypes:
          - CFBundleURLSchemes: [pawpet]
    dependencies:
      - target: PawPetWidget
  PawPetWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      - path: Shared
      - path: Resources/PetFrames
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kotoko.pawpet.widget
        CODE_SIGN_ENTITLEMENTS: Widget/PawPetWidget.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: "爪爪桌宠组件"
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: 爪爪桌宠组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
